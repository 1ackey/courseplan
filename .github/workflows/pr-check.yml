name: PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'mkdocs.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Check changed course files
        id: changed
        run: |
          CHANGED=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- 'docs/categories/**/*.md' | grep -v index.md || true)
          if [ -z "$CHANGED" ]; then
            echo "No course files changed."
            echo "files=" >> $GITHUB_OUTPUT
          else
            echo "Changed course files:"
            echo "$CHANGED"
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Validate course files
        if: steps.changed.outputs.files != ''
        run: |
          echo "${{ steps.changed.outputs.files }}" | while read -r file; do
            [ -z "$file" ] && continue
            python scripts/validate-course.py "$file"
          done

      - name: Generate teacher index
        run: python scripts/generate-teachers.py

      - name: Check teacher index changed
        run: |
          if ! git diff --quiet docs/teachers/index.md; then
            echo "::warning::Teacher index needs update. Run 'python scripts/generate-teachers.py' locally."
            git diff docs/teachers/index.md
          fi

      - name: Build site
        run: |
          mkdocs build --strict
          echo "Site built successfully."
