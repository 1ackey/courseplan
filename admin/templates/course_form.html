{% extends "base.html" %}
{% block title %}{% if course %}编辑课程{% else %}添加课程{% endif %}{% endblock %}
{% block content %}
<h1>{% if course %}编辑课程{% else %}添加课程{% endif %}</h1>

<div class="form-card">
    <form method="post">
        <div class="form-group">
            <label>课程代码 *</label>
            <input type="text" name="code" value="{{ course.code if course else '' }}" required placeholder="例如：ENG820">
        </div>
        <div class="form-group">
            <label>课程名称 *</label>
            <input type="text" name="name" value="{{ course.name if course else '' }}" required placeholder="例如：语用学">
        </div>
        <div class="form-group">
            <label>课程类别 *</label>
            <select name="category" required>
                <option value="基础必修" {% if course and course.category == '基础必修' %}selected{% endif %}>基础必修</option>
                <option value="基础选修" {% if course and course.category == '基础选修' %}selected{% endif %}>基础选修</option>
                <option value="专业方向课" {% if course and course.category == '专业方向课' %}selected{% endif %}>专业方向课</option>
                <option value="实验课" {% if course and course.category == '实验课' %}selected{% endif %}>实验课</option>
            </select>
        </div>
        <div class="form-group">
            <label>子类别</label>
            <input type="text" name="subcategory" value="{{ course.subcategory if course and course.subcategory else '' }}" placeholder="例如：语言学方向 / 语言技能 / 商务 / 文学与文化">
        </div>
        <div class="form-group">
            <label>开课学院</label>
            <input type="text" name="department" value="{{ course.department if course else '英语学院' }}" placeholder="例如：英语学院">
        </div>
        <div style="display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="{{ url_for('course_list') }}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>
{% endblock %}
