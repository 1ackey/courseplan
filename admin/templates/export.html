{% extends "base.html" %}
{% block title %}导出 Markdown{% endblock %}
{% block content %}
<h1>导出 Markdown</h1>

<div class="detail-section">
    <p>将数据库中的所有开课记录导出为 MkDocs 的 Markdown 文件。</p>
    <p style="color:var(--gray-500);font-size:13px;margin-top:8px;">
        导出脚本会根据课程类别自动将文件放到 <code>docs/categories/</code> 对应目录下。
    </p>
    <p style="color:var(--gray-500);font-size:13px;">
        同时会更新各分类的 <code>index.md</code> 索引文件和教师索引。
    </p>

    <form method="post" action="{{ url_for('export_run') }}" style="margin-top:16px;">
        <button type="submit" class="btn btn-primary">执行导出</button>
    </form>
</div>
{% endblock %}
