<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · CoursePlan 管理后台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <style>body{justify-content:center;align-items:center;display:flex;} .login-card{background:#fff;padding:32px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);width:360px;}</style>
</head>
<body>
    <div class="login-card">
        <h1 style="font-size:20px;">CoursePlan 管理</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}" style="margin-top:12px;"><span>{{ message }}</span></div>
        {% endfor %}
        {% endwith %}
        <form method="post" style="margin-top:16px;">
            <input type="hidden" name="next" value="{{ next }}">
            <div class="form-group">
                <label>管理员密码</label>
                <input type="password" name="password" autofocus required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">登录</button>
        </form>
        <p style="margin-top:16px;font-size:12px;color:var(--gray-500);text-align:center;">
            <a href="/" target="_blank">返回网站</a>
        </p>
    </div>
</body>
</html>
