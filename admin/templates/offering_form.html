{% extends "base.html" %}
{% block title %}{% if offering %}编辑开课记录{% else %}新增开课记录{% endif %}{% endblock %}
{% block content %}
<h1>{% if offering %}编辑开课记录{% else %}新增开课记录{% endif %}</h1>

<div class="form-card">
    <form method="post">
        <div class="form-group">
            <label>课程 *</label>
            <select name="course_id" required>
                {% for c in courses %}
                <option value="{{ c.id }}" {% if offering and offering.course_id == c.id %}selected{% endif %}>
                    {{ c.code }} - {{ c.name }} ({{ c.category }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>任课教师 *</label>
            <select name="teacher_id" required>
                {% for t in teachers %}
                <option value="{{ t.id }}" {% if offering and offering.teacher_id == t.id %}selected{% endif %}>
                    {{ t.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>学期 *</label>
            <select name="semester_id" required>
                {% for s in semesters %}
                <option value="{{ s.id }}" {% if offering and offering.semester_id == s.id %}selected{% endif %}>
                    {{ s.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>总课时</label>
            <input type="number" name="total_hours" value="{{ offering.total_hours if offering else 32 }}">
        </div>
        <div class="form-group">
            <label>周课时</label>
            <input type="number" name="weekly_hours" value="{{ offering.weekly_hours if offering else 2 }}">
        </div>
        <div class="form-group">
            <label>教学周数</label>
            <input type="number" name="teaching_weeks" value="{{ offering.teaching_weeks if offering else 16 }}">
        </div>
        <div class="form-group">
            <label>考核方式</label>
            <textarea name="assessment_method" placeholder="例如：平时40% + 期末闭卷60%">{{ offering.assessment_method if offering else '' }}</textarea>
        </div>
        <div class="form-group">
            <label>信息来源</label>
            <input type="text" name="info_source" value="{{ offering.info_source if offering else '' }}" placeholder="例如：2023 级培养方案">
        </div>
        <div style="display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="{{ url_for('offering_list') }}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>
{% endblock %}
