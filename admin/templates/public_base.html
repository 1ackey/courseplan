<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}课程信息编辑{% endblock %} · 去码头学会英语</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --primary:#4051b5; --primary-light:#e8eaf6; --danger:#c62828; --gray-100:#f5f5f5; --gray-300:#e0e0e0; --gray-500:#9e9e9e; --gray-700:#616161; --gray-900:#212121; --radius:6px; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--gray-100); color: var(--gray-900); min-height: 100vh; }
        .page { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 20px; }
        .topbar a { color: var(--primary); text-decoration: none; font-size: 14px; font-weight: 600; }
        .topbar .brand { font-size: 15px; font-weight: 700; color: var(--gray-900); }
        h1 { font-size: 22px; margin-bottom: 6px; }
        .subtitle { color: var(--gray-500); font-size: 13px; margin-bottom: 18px; }
        .mode-note { display: inline-block; padding: 4px 10px; border-radius: 10px; font-size: 12px; background: var(--primary-light); color: var(--primary); margin-bottom: 16px; }
        .card { background: #fff; padding: 24px; border-radius: var(--radius); box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--gray-700); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 14px; font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(63,81,181,.12); }
        textarea { min-height: 90px; resize: vertical; }
        textarea.tall { min-height: 220px; }
        .hint { font-size: 12px; color: var(--gray-500); margin-top: 4px; line-height: 1.6; }
        .btn { display: inline-block; padding: 9px 20px; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #303f9f; }
        .btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
        .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        @media (max-width: 600px) { .grid3 { grid-template-columns: 1fr; } }
        .danger-box { border: 1px solid #ffcdd2; background: #ffebee; padding: 16px; border-radius: var(--radius); }
        .danger-box p { font-size: 13px; color: var(--danger); margin-bottom: 12px; }
        .msg-ok { background: #e8f5e9; color: #2e7d32; padding: 14px; border-radius: var(--radius); font-size: 14px; }
        .msg-err { background: #ffebee; color: var(--danger); padding: 14px; border-radius: var(--radius); font-size: 14px; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: 12px; }
        th, td { padding: 8px 10px; font-size: 13px; border-bottom: 1px solid var(--gray-300); text-align: left; }
        th { background: var(--gray-100); font-size: 12px; color: var(--gray-700); }
    </style>
</head>
<body>
    <div class="topbar">
        <span class="brand">📚 去码头学会英语</span>
        <a href="/">返回网站 &rarr;</a>
    </div>
    <div class="page">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
