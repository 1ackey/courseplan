{% extends "base.html" %}
{% block title %}{% if semester %}编辑学期{% else %}添加学期{% endif %}{% endblock %}
{% block content %}
<h1>{% if semester %}编辑学期{% else %}添加学期{% endif %}</h1>

<div class="form-card">
    <form method="post">
        <div class="form-group">
            <label>学期名称 *</label>
            <input type="text" name="name" value="{{ semester.name if semester else '' }}" required
                   placeholder="例如：2025-2026-2">
            <div style="font-size:12px;color:#9e9e9e;margin-top:4px;">格式：学年-学期序号，如 2025-2026-2</div>
        </div>
        <div class="form-group">
            <label>学年 *</label>
            <input type="text" name="academic_year" value="{{ semester.academic_year if semester else '' }}" required
                   placeholder="例如：2025-2026">
        </div>
        <div class="form-group">
            <label>学期 *</label>
            <select name="term" required>
                <option value="1" {% if semester and semester.term == 1 %}selected{% endif %}>第一学期（秋季）</option>
                <option value="2" {% if semester and semester.term == 2 %}selected{% endif %}>第二学期（春季）</option>
            </select>
        </div>
        <div style="display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="{{ url_for('semester_list') }}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>
{% endblock %}
