{% extends "base.html" %}
{% block title %}站点设置{% endblock %}
{% block content %}
<h1>站点设置 · 管理模式</h1>

<div class="detail-section" style="max-width:720px;">
    <p>当前模式：<span class="badge" style="font-size:14px;">模式 {{ mode }}</span></p>

    <form method="post" style="margin-top:16px;">
        <div class="form-group" style="padding:14px;border:1px solid var(--gray-300);border-radius:6px;margin-bottom:10px;{% if mode == 1 %}border-color:var(--primary);{% endif %}">
            <label style="font-size:15px;">
                <input type="radio" name="mode" value="1" {% if mode == 1 %}checked{% endif %}>
                <b>模式 1 · 完全开放</b>
            </label>
            <p style="font-size:13px;color:var(--gray-500);margin-top:6px;">所有人都可以直接修改、新增、删除开课记录，保存后立即生效并自动发布。</p>
        </div>
        <div class="form-group" style="padding:14px;border:1px solid var(--gray-300);border-radius:6px;margin-bottom:10px;{% if mode == 2 %}border-color:var(--primary);{% endif %}">
            <label style="font-size:15px;">
                <input type="radio" name="mode" value="2" {% if mode == 2 %}checked{% endif %}>
                <b>模式 2 · 提交审核</b>
            </label>
            <p style="font-size:13px;color:var(--gray-500);margin-top:6px;">所有人都可以提交修改/新增/删除，进入审核队列，由管理员审核通过后发布。</p>
        </div>
        <div class="form-group" style="padding:14px;border:1px solid var(--gray-300);border-radius:6px;margin-bottom:10px;{% if mode == 3 %}border-color:var(--primary);{% endif %}">
            <label style="font-size:15px;">
                <input type="radio" name="mode" value="3" {% if mode == 3 %}checked{% endif %}>
                <b>模式 3 · 只读</b>
            </label>
            <p style="font-size:13px;color:var(--gray-500);margin-top:6px;">除管理员外，所有人不能提交任何修改（网站只读）。</p>
        </div>
        <button type="submit" class="btn btn-primary">保存模式</button>
    </form>
</div>
{% endblock %}
