{% extends "base.html" %}
{% block title %}{% if teacher %}编辑教师{% else %}添加教师{% endif %}{% endblock %}
{% block content %}
<h1>{% if teacher %}编辑教师{% else %}添加教师{% endif %}</h1>

<div class="form-card">
    <form method="post">
        <div class="form-group">
            <label>姓名 *</label>
            <input type="text" name="name" value="{{ teacher.name if teacher else '' }}" required>
        </div>
        <div class="form-group">
            <label>所属院系</label>
            <input type="text" name="department" value="{{ teacher.department if teacher else '' }}" placeholder="例如：英语学院 · 语言学系">
        </div>
        <div style="display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="{{ url_for('teacher_list') }}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>
{% endblock %}
