{% extends "base.html" %}
{% block title %}教师管理{% endblock %}
{% block content %}
<div class="flex-between mb-16">
    <h1>教师管理</h1>
    <a href="{{ url_for('teacher_new') }}" class="btn btn-primary">+ 添加教师</a>
</div>

{% if teachers %}
<table>
    <thead>
        <tr>
            <th>姓名</th>
            <th>所属院系</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
    {% for t in teachers %}
        <tr>
            <td>{{ t.name }}</td>
            <td>{{ t.department or '-' }}</td>
            <td class="table-actions">
                <a href="{{ url_for('teacher_edit', teacher_id=t.id) }}" class="btn btn-sm btn-outline">编辑</a>
                <form method="post" action="{{ url_for('teacher_delete', teacher_id=t.id) }}" onsubmit="return confirm('确定删除 {{ t.name }}？')">
                    <button class="btn btn-sm btn-danger">删除</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% else %}
<div class="empty-state">暂无教师数据</div>
{% endif %}
{% endblock %}
